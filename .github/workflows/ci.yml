name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  fzf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fzf
        run: sudo apt-get update && sudo apt-get install --yes fzf
      - run: fzf --version

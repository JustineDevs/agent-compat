name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/agents/**"
      - ".changeset/**"
      - ".releaserc.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/publish-github-package.ts"

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check npm publishing credentials
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NPM_TOKEN is not configured; semantic-release will be skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run semantic-release
        if: steps.npm-auth.outputs.available == 'true'
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Skip semantic-release without npm credentials
        if: steps.npm-auth.outputs.available != 'true'
        run: echo "Release skipped because NPM_TOKEN is not configured."

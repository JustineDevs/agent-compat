name: Bug report
description: Report a reproducible problem in agents
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please provide a minimal reproduction and the affected adapter.
  - type: input
    id: adapter
    attributes:
      label: Adapter
      placeholder: cursor, codex, generic
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the manifest, command, and observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
